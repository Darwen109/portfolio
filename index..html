<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abdelrahman Hisham — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Young+Serif&family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--card:#0d1426;--line:#232d45;--red:#d9a441;--deep:#0f1a35;--cream:#f0e9e4;--mut:#a8b0c2;--disp:'Bagel Fat One',Impact,sans-serif;--body:'Young Serif',Georgia,serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:90px}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--cream);font-family:var(--body);line-height:1.7;overflow-x:hidden}
img,svg{max-width:100%}
a{color:inherit;text-decoration:none}
.wrap{padding:0 20px;max-width:1100px;margin:auto}
section{padding:80px 0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:12px 20px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.logo{font-family:var(--disp);font-size:20px;letter-spacing:1px}.logo b{color:var(--red)}
.burger{background:none;border:0;cursor:pointer;padding:8px}.burger i{display:block;width:30px;height:3px;background:var(--cream);margin:6px 0}
nav{display:none;position:absolute;top:100%;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 20px 20px}
nav.open{display:block}nav a{display:block;padding:10px 0;font-size:20px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--cream);color:#000;border:2px solid var(--red);border-radius:999px;padding:14px 26px;font:inherit;font-size:18px;cursor:pointer;box-shadow:0 7px 0 #8a6218;transition:transform .15s,box-shadow .15s}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #8a6218}
.btn.round{width:62px;height:62px;padding:0;justify-content:center;border-radius:50%}
.eyebrow{color:var(--red);font-size:20px}
h2{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(34px,8vw,64px);line-height:1.15;margin:6px 0 16px}
.rule{height:2px;background:var(--line);margin-bottom:44px;position:relative}.rule::after{content:"";position:absolute;left:0;top:0;height:2px;width:21%;background:var(--red)}
.card{background:var(--card);border:2px solid var(--line);border-radius:36px;overflow:hidden}
.ph{background:linear-gradient(135deg,#14203d,#0a1021);display:grid;place-items:center;color:#6f7a95;font-size:15px;text-align:center;padding:10px}
/* hero */
.hero{background:radial-gradient(circle at 0 0,#1c3363 0,#12244a 30%,#0a1226 65%);padding:56px 0 0;text-align:center;overflow:hidden}
.hero h1{font-weight:400;font-size:clamp(60px,17vw,150px);line-height:1.05}
.hero h3{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:clamp(22px,5vw,34px);line-height:1.3;margin:34px 0 14px}.hero h3 em{font-style:normal;color:#e9b559}
.avail{display:inline-flex;align-items:center;gap:12px;font-size:19px}.dot{width:22px;height:22px;border-radius:50%;background:#2fd35b;box-shadow:0 0 0 6px #2a3350}
.hero p.lead{color:var(--mut);font-size:19px;max-width:560px;margin:34px auto;text-align:left}
.cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:46px}
.hero .ph{width:min(440px,94%);height:min(600px,128vw);margin:auto;position:relative;display:block;padding:0;background:none;overflow:visible}
.ribbon{background:var(--red);color:#0b1020;overflow:hidden;white-space:nowrap;padding:16px 0;font-size:34px;border-top:2px solid #a97a22}
.ribbon div{display:inline-block;animation:go 22s linear infinite}.ribbon span{margin:0 22px}
@keyframes go{to{transform:translateX(-50%)}}
/* about */
.circle{width:min(420px,90%);aspect-ratio:1;border-radius:50%;margin:0 auto 26px;background:radial-gradient(circle at 50% 30%,#1b3568,#070c1a 70%)}
.about{padding:28px;background:var(--deep);border-color:#2b3a5e}
.pill{display:inline-block;border:2px solid var(--red);background:#16264a;border-radius:999px;padding:8px 22px;color:var(--mut);margin-bottom:14px}.pill b{color:var(--red);font-size:26px;font-weight:400}
.about h3{font-family:var(--disp);font-weight:400;font-size:34px;text-transform:uppercase;margin-bottom:14px}.about h3 em{font-style:normal;color:var(--red)}
.about p{color:var(--mut);margin-top:16px}.about p:first-of-type{color:var(--cream);font-size:21px}
/* services */
.grid{display:grid;gap:26px}
.svc .ph{height:300px;border-radius:0;padding:0;overflow:hidden;position:relative;background:#0a1226}.svc .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}.svc .ph::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:linear-gradient(to top,rgba(10,18,38,.55),transparent);pointer-events:none}.svc div.b{padding:30px 34px}
.svc h3{font-family:var(--disp);font-weight:400;font-size:27px;text-transform:uppercase;margin-bottom:12px}
.svc li{list-style:none;color:var(--mut);font-size:19px;padding:5px 0}.svc li::before{content:"– ";color:var(--red)}
.svc .more{display:flex;justify-content:space-between;align-items:center;border-top:0;margin-top:20px;font-size:20px}
.svc .more::before{content:"";position:absolute}
.go{width:54px;height:54px;border-radius:50%;background:var(--red);display:grid;place-items:center;font-size:24px}
/* why */
.tl .wimg{margin-top:18px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#0a1226}.tl .wimg img{width:100%;height:240px;object-fit:cover;object-position:50% 40%;display:block}
.tl{position:relative;padding-left:44px;border-left:0}
.tl::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.tl .it{display:grid;grid-template-columns:90px 1fr;gap:14px;padding:30px 0;border-bottom:1px solid var(--line)}
.tl .n{font-size:56px;color:var(--red);line-height:1}
.tl h4{font-family:var(--disp);font-weight:400;font-size:21px;text-transform:uppercase;margin-bottom:8px}.tl p{color:var(--mut)}
.sub{font-family:var(--disp);font-weight:400;font-size:clamp(26px,6vw,40px);text-transform:uppercase;margin:60px 0 22px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:16px}.tool{padding:26px 10px;text-align:center;border-radius:34px}.tool b{display:block;color:var(--red);font-size:46px;font-weight:400;line-height:1.1}.tool:last-child{grid-column:1/-1}
.tags{display:flex;flex-wrap:wrap;gap:14px}.tags span{border:2px solid var(--line);border-radius:999px;padding:14px 26px;font-size:19px}
.hero .ph .blob{position:absolute;inset:0;border-radius:50% 50% 0 0/34% 34% 0 0;overflow:hidden;background:radial-gradient(circle at 50% 40%,#1a3a73 0,#0f2147 45%,#080e20 80%)}
.hero .ph .blob::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,#0a1226 0,rgba(10,18,38,.55) 22%,transparent 50%),radial-gradient(circle at 50% 35%,rgba(70,120,210,.3),transparent 65%);mix-blend-mode:multiply}
.hero .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 10%;display:block;filter:contrast(1.05) saturate(.9)}
.tilt{color:#0b1020;position:absolute;left:-30%;width:160%;overflow:hidden;white-space:nowrap;background:var(--red);padding:6px 0;font-size:24px;z-index:3;box-shadow:0 10px 26px rgba(0,0,0,.45);line-height:1.5}
.tilt.a{bottom:34%;transform:rotate(-6deg)}.tilt.b{bottom:15%;transform:rotate(5deg);background:#a97a22}
.tilt div{display:inline-block;animation:go 24s linear infinite}.tilt.b div{animation-direction:reverse}.tilt span{margin:0 18px}
/* clients + stats */
.logos{display:grid;grid-template-columns:1fr 1fr;gap:20px}.logos .ph{height:110px;border-radius:24px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:70px}
.stat{padding:30px 6px;text-align:center;border-radius:40px}
.ring{width:80px;height:80px;margin:0 auto 18px;border-radius:50%;border:3px solid var(--red);border-right-color:#2b3a5e;display:grid;place-items:center;color:var(--red);font-size:28px}
.stat b{display:block;font-size:46px;font-weight:400;line-height:1.1}.stat span{font-size:17px}
/* work */
.work{position:relative;border-radius:34px;overflow:hidden;min-height:420px;display:flex;align-items:flex-end}
.work .ph{position:absolute;inset:0;border-radius:0}
.work div.c{position:relative;padding:22px 26px;width:100%;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.work small{color:#f0c26b;font-size:18px}.work h4{font-weight:400;font-size:25px;line-height:1.3}
.center{text-align:center;margin-top:50px}
/* reviews */
.rev{padding:0}.rev .ph{height:300px;border-radius:0;border-bottom:2px solid var(--line)}
.rev .b{padding:26px}
.rev h4{font-family:var(--disp);font-weight:400;font-size:28px;text-transform:uppercase}
.stars{color:#f5b400;font-size:30px;letter-spacing:6px;margin:14px 0}.stars small{color:var(--cream);font-size:20px;letter-spacing:0;margin-left:12px}
.rev p.q{font-size:25px;line-height:1.6;min-height:200px}
.arrows{display:flex;gap:14px}.arrows .btn{width:64px;height:64px;padding:0;justify-content:center;border-radius:50%}
/* contact */
.ci{display:flex;align-items:center;gap:20px;padding:26px;border-radius:36px;margin-bottom:16px}.ci.hot{background:#14213f;border-color:var(--red)}
.ico{flex:none;width:68px;height:68px;border:2px solid var(--line);border-radius:22px;display:grid;place-items:center;color:var(--red);font-size:28px}
.ci small{display:block;color:var(--mut);font-size:18px}.ci b{font-weight:400;font-size:22px;word-break:break-all}
.follow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:22px 26px;border-radius:40px;margin:30px 0}
.follow b{font-weight:400;font-size:22px;margin-right:8px}.follow .ico{width:62px;height:62px;color:var(--cream);font-size:22px}
form.card{padding:34px 26px}label{display:block;font-size:21px;margin:22px 0 12px}
input,textarea{width:100%;background:var(--card);border:2px solid var(--line);border-radius:30px;padding:20px 26px;color:var(--cream);font:inherit;font-size:20px}
input:focus,textarea:focus,.btn:focus-visible,.burger:focus-visible{outline:3px solid var(--red);outline-offset:3px}
textarea{border-radius:30px;min-height:140px}form .btn{margin-top:30px}
footer{border-top:1px solid var(--line);padding:30px 20px;text-align:center;color:var(--mut)}
/* floating */
.mailline{margin-top:18px;color:var(--mut);font-size:18px;word-break:break-all}.mailline button{margin-inline-start:10px;background:none;border:2px solid var(--red);color:var(--cream);border-radius:999px;padding:4px 16px;font:inherit;font-size:15px;cursor:pointer}

.mascot{background:none;border:0;padding:0;cursor:pointer;filter:drop-shadow(0 8px 14px rgba(0,0,0,.5))}.mascot .onl{position:absolute;top:8px;right:8px;width:16px;height:16px;border-radius:50%;background:#2fd35b;border:3px solid var(--bg);z-index:1}
.mascot .bot{display:block;width:84px;height:84px}
.panel{position:fixed;left:14px;bottom:calc(110px + env(safe-area-inset-bottom,0px));width:min(390px,calc(100vw - 28px));max-height:calc(100% - 150px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;z-index:40;background:var(--deep);border:3px solid var(--red);border-radius:34px;box-shadow:0 8px 0 #8a6218,0 24px 50px rgba(0,0,0,.6);overflow:hidden;animation:up .35s both}
.panel[hidden]{display:none}
.ph2{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#0a1226;border-bottom:3px solid var(--red)}.ph2 b{display:block;font-family:var(--disp);font-weight:400;font-size:19px;line-height:1.2}
.av{border:3px solid var(--red);border-radius:16px;padding:2px;background:#0a1226;display:grid}.on{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:15px}.on i,.pillo i{width:10px;height:10px;border-radius:50%;background:#2fd35b;display:inline-block}
.x{margin-inline-start:auto;width:44px;height:44px;border-radius:50%;border:2px solid var(--red);background:var(--cream);color:#000;font-size:18px;cursor:pointer;flex:none}
.pb{overflow:auto;padding:14px 16px 20px;text-align:center;overscroll-behavior:contain}.big{display:grid;place-items:center}
.pb h3{font-family:var(--disp);font-weight:400;text-transform:uppercase;font-size:22px;line-height:1.3;margin:6px 0 6px}.pb .sub{color:var(--mut);font-size:16px;line-height:1.5}
.pillo{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--red);border-radius:999px;padding:6px 18px;margin:12px 0 16px;font-size:16px;background:#0a1226}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.big1{flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:24px;padding:16px 10px;text-align:center;line-height:1.3}.big1 b{font-weight:400;font-size:18px}.big1 small{font-size:14px;color:#4a4f60}
.four{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.four .btn{justify-content:center;padding:12px 10px;font-size:16px}
.top.hide{opacity:0;pointer-events:none;transform:translateY(20px)}
.top{transition:opacity .3s,transform .3s;position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;width:64px;height:64px;padding:0;justify-content:center;border-radius:50%}
.mascot{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:25;width:84px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@media(min-width:800px){.grid.three{grid-template-columns:repeat(3,1fr)}.grid.two{grid-template-columns:1fr 1fr}.stats{gap:26px}}
@media(prefers-reduced-motion:reduce){.ribbon div,.tilt div,.mascot{animation:none}html{scroll-behavior:auto}}

.hg{display:flex;align-items:center;gap:6px}
.lang{background:none;border:2px solid var(--red);color:var(--cream);border-radius:999px;padding:6px 16px;font:inherit;font-size:16px;cursor:pointer}
.lang:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.mono{font-family:var(--disp);font-size:84px;color:#e9b559;line-height:1}
.hero h1{font-family:var(--disp);font-size:clamp(40px,11vw,110px)}
.tool span{font-size:17px}
.tool b{font-family:var(--disp)}
html[dir=rtl]{--disp:'Cairo',Tahoma,sans-serif;--body:'Cairo',Tahoma,sans-serif}
html[dir=rtl] body{line-height:1.9}
html[dir=rtl] .hero p.lead{text-align:right}
html[dir=rtl] .rule::after{left:auto;right:0}
html[dir=rtl] .tl{padding-left:0;padding-right:44px}
html[dir=rtl] .tl::before{left:auto;right:0}
html[dir=rtl] .nav a,html[dir=rtl] nav{text-align:right}
html[dir=rtl] .go{transform:scaleX(-1)}


html[dir=rtl] h2,html[dir=rtl] .hero h1,html[dir=rtl] .hero h3{font-weight:900}


@keyframes up{from{opacity:0;translate:0 34px}to{opacity:1;translate:0 0}}
@keyframes shine{to{background-position:200% center}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(47,211,91,.75)}100%{box-shadow:0 0 0 18px rgba(47,211,91,0)}}
@keyframes drift{50%{translate:0 -14px}}
@keyframes glow{50%{opacity:.5}}
@keyframes grow{from{width:0}to{width:21%}}
@keyframes bg{50%{background-position:100% 100%}}
.hero{background-size:200% 200%;animation:bg 14s ease-in-out infinite}
.hero .wrap>*{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.hero .wrap>*:nth-child(2){animation-delay:.12s}.hero .wrap>*:nth-child(3){animation-delay:.24s}.hero .wrap>*:nth-child(4){animation-delay:.36s}.hero .wrap>*:nth-child(5){animation-delay:.48s}
.hero .wrap>h1{background:linear-gradient(90deg,#f0e9e4 0%,#f0c26b 25%,#f0e9e4 50%,#f0c26b 75%,#f0e9e4 100%);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:up .9s both,shine 6s linear infinite}
.hero .wrap>.ph{animation:up .9s .6s both,drift 5s 1.6s ease-in-out infinite}
.dot{animation:ping 1.8s ease-out infinite}
.ph .mono{animation:glow 3s ease-in-out infinite}
.svc .ph{background:linear-gradient(135deg,#14203d,#0a1021,#17264a);background-size:200% 200%;animation:bg 8s ease-in-out infinite}
.card,.tags span,.go{transition:transform .35s,border-color .35s,box-shadow .35s,background .35s}
.card:hover{transform:translateY(-8px);border-color:var(--red);box-shadow:0 18px 40px rgba(217,164,65,.22)}
.tags span:hover{background:var(--red);border-color:var(--red);transform:translateY(-4px) rotate(-2deg)}
.tool b{transition:transform .35s}.tool:hover b{transform:scale(1.2) rotate(-6deg)}
.svc:hover .go{transform:translateX(6px) rotate(-45deg)}
.ribbon:hover div{animation-play-state:paused}
.follow .ico{transition:transform .3s,background .3s}.follow .ico:hover{background:var(--red);transform:translateY(-5px) rotate(8deg)}
.work{display:block;min-height:0;background:#0d1530}
.work img{display:block;width:100%;aspect-ratio:16/10;object-fit:contain;background:#080d1c;transition:transform .8s}
.work:hover img{transform:scale(1.05)}
.work.wide{grid-column:1/-1}.work.wide img{aspect-ratio:16/9}
.work div.c{position:static;padding:20px 26px 26px;background:none}
@supports(animation-timeline:view()){
.reveal{animation:up linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
.rule::after{animation:grow linear both;animation-timeline:view();animation-range:entry 20% cover 30%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ===== GLASS THEME ===== */
html{background:#050813}
body{background:transparent}
.orbs{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
radial-gradient(55vmax 55vmax at 8% 4%,rgba(217,164,65,.30),transparent 62%),
radial-gradient(65vmax 65vmax at 100% 30%,rgba(55,105,230,.38),transparent 62%),
radial-gradient(55vmax 55vmax at 15% 70%,rgba(125,75,225,.26),transparent 62%),
radial-gradient(50vmax 50vmax at 90% 100%,rgba(217,164,65,.18),transparent 62%),#060914}
.card,.tool,.stat,.ci,.follow,.tags span,.pill,.panel,.about,.ci.hot,.logos .ph,input,textarea{
background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
border:1px solid rgba(255,255,255,.18);
-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.03),0 18px 40px rgba(0,0,0,.32)}
.ci.hot{border-color:rgba(217,164,65,.55);background:linear-gradient(135deg,rgba(217,164,65,.22),rgba(217,164,65,.05))}
.rule,.tl .it{background-color:transparent}.tl .it{border-bottom-color:rgba(255,255,255,.12)}
.rule{background:rgba(255,255,255,.14)}
header,nav,body::before{background:rgba(8,13,30,.5);-webkit-backdrop-filter:blur(20px) saturate(170%);backdrop-filter:blur(20px) saturate(170%);border-bottom:1px solid rgba(255,255,255,.14)}
body::before{border-bottom:0}
.hero{background:none}
.btn{background:linear-gradient(135deg,rgba(255,255,255,.2),rgba(255,255,255,.07));color:var(--cream);border:1px solid rgba(255,255,255,.32);
-webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.32)}
.btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 10px rgba(0,0,0,.3)}
.cta .btn:first-child,.btn.top{border-color:rgba(217,164,65,.7);background:linear-gradient(135deg,rgba(217,164,65,.4),rgba(217,164,65,.1))}
.big1 small{color:var(--mut)}.x{background:rgba(255,255,255,.16);color:var(--cream);border:1px solid rgba(255,255,255,.3)}
.go{background:linear-gradient(135deg,rgba(233,181,89,.9),rgba(217,164,65,.55));color:#0b1020;border:1px solid rgba(255,255,255,.35);box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.ribbon{background:rgba(233,181,89,.88);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.5);border-bottom:1px solid rgba(255,255,255,.3)}
.tilt{background:rgba(233,181,89,.85);border-top:1px solid rgba(255,255,255,.5);border-bottom:1px solid rgba(255,255,255,.25)}.tilt.b{background:rgba(190,140,50,.82)}
.panel{background:linear-gradient(135deg,rgba(25,40,80,.72),rgba(10,18,40,.6));border-color:rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 24px 60px rgba(0,0,0,.55)}
.ph2{background:rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.16)}.av,.pillo{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25)}
.work{border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 40px rgba(0,0,0,.35)}
.work div.c{background:rgba(8,13,30,.42);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.16)}
.rev .ph{border-bottom-color:rgba(255,255,255,.14)}
.ring{border-color:rgba(217,164,65,.9);border-right-color:rgba(255,255,255,.2)}
.ico{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2)}
.mailline button{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.card,.tool,.stat,.ci,.follow,.panel,.about{background:#101a33}header,nav{background:#080d1e}}
@media(prefers-reduced-transparency:reduce){.card,.tool,.stat,.ci,.follow,.panel,.about,header,nav{-webkit-backdrop-filter:none;backdrop-filter:none;background:#101a33}}

/* ===== MOTION POLISH ===== */
:root{--ease:cubic-bezier(.2,.7,.2,1)}
.rv{opacity:0;translate:0 38px;scale:.97;transition:opacity .85s var(--ease),translate .85s var(--ease),scale .85s var(--ease)}
.rv.in{opacity:1;translate:0 0;scale:1}
.rule.rv{translate:0 0;scale:1}.rule.in::after{animation:grow 1s .25s var(--ease) both}
.orbs{animation:orbs 28s ease-in-out infinite alternate;will-change:transform}
@keyframes orbs{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-3%,2%,0) scale(1.12)}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.9)}to{opacity:1;transform:none}}
@keyframes dropin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.panel{transform-origin:0 100%;animation:pop .38s var(--ease) both}
nav.open{animation:dropin .28s var(--ease) both}
.card,.stat,.tool,.ci,.follow,.tags span{transition:transform .4s var(--ease),border-color .4s,box-shadow .4s,background .4s}
@media(hover:hover){.card:hover,.stat:hover,.tool:hover,.ci:hover,.tags span:hover{transform:translateY(-6px);border-color:rgba(217,164,65,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 26px 50px rgba(0,0,0,.42),0 0 36px rgba(217,164,65,.14)}.btn:hover{transform:translateY(-3px)}}
.btn{transition:transform .25s var(--ease),box-shadow .25s,background .25s}
.mascot{transition:transform .3s var(--ease)}.mascot:active{transform:scale(.92)}
#prog{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;z-index:35;transform-origin:0 50%;transform:scaleX(var(--p,0));background:linear-gradient(90deg,#a97a22,#f0c26b);pointer-events:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;translate:none;scale:1;transition:none}.orbs{animation:none}#prog{display:none}}

/* ===== HERO FIX ===== */
@keyframes go3{from{transform:translate3d(0,0,0)}to{transform:translate3d(-50%,0,0)}}
.tilt{left:-35%;width:170%;padding:2px 0;font-size:20px;line-height:1.6;-webkit-transform-style:flat;isolation:isolate}
.tilt.a{bottom:17%;transform:rotate(-5deg)}
.tilt.b{bottom:6%;transform:rotate(4deg)}
.tilt div{animation:go3 26s linear infinite;-webkit-backface-visibility:hidden;backface-visibility:hidden;will-change:transform}
.tilt.b div{animation:go3 30s linear infinite reverse}
.tilt span{margin:0 16px}
.hero .ph img{transform:scale(1.32);transform-origin:50% 14%;object-position:50% 0}
.mascot,.mascot .bot{width:68px;height:68px}.mascot .onl{top:5px;right:5px;width:14px;height:14px}
.btn.top{font-size:30px;font-weight:700;color:#f0c26b;line-height:1}
@media(prefers-reduced-motion:reduce){.tilt div{animation:none}}

/* ===== TIMELINE: scroll-filled line + staged items ===== */
.tl::before{background:rgba(255,255,255,.14);width:3px;border-radius:3px}
.tl::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;background:linear-gradient(#f0c26b,#d9a441);box-shadow:0 0 14px rgba(217,164,65,.7);transform-origin:50% 0;transform:scaleY(var(--f,0));z-index:1;pointer-events:none}
.js .tl .it{opacity:0;translate:0 34px;transition:opacity .7s var(--ease),translate .7s var(--ease)}
.js .tl .it.show{opacity:1;translate:0 0}
@media(prefers-reduced-motion:reduce){.js .tl .it{opacity:1;translate:none;transition:none}.tl::after{transform:none}}

/* ===== PERFORMANCE: smooth ribbons on iPhone ===== */
.hero .ph{animation:none!important;translate:none!important}
.hero .wrap>.ph{animation:none!important}
.hero .ph .blob::after{mix-blend-mode:normal;background:linear-gradient(to top,rgba(10,18,38,.95) 0,rgba(10,18,38,.45) 22%,transparent 50%)}
.hero .ph img{filter:none}
.tilt{box-shadow:none;isolation:auto;-webkit-transform-style:flat;transform:translateZ(0) rotate(var(--r,0deg));contain:layout paint;overflow:hidden}
.tilt.a{--r:-5deg;transform:rotate(-5deg)}.tilt.b{--r:4deg;transform:rotate(4deg)}
.tilt{will-change:transform}
.tilt div{will-change:transform;animation-duration:22s}.tilt.b div{animation-duration:26s}
.ribbon{-webkit-backdrop-filter:none;backdrop-filter:none;background:#e0b15a;contain:paint}
.ribbon div{will-change:transform;backface-visibility:hidden}
.orbs{animation:none;will-change:auto}
.card,.tool,.stat,.ci,.follow,.tags span,.pill,.about,.logos .ph,input,textarea{-webkit-backdrop-filter:blur(12px) saturate(150%);backdrop-filter:blur(12px) saturate(150%)}

const upd=()=>{const r=tl.getBoundingClientRect(),H=r.height||1;const filled=Math.max(0,Math.min(H,innerHeight*.62-r.top));tl.style.setProperty('--f',filled/H);tl.querySelectorAll('.it').forEach(it=>it.classList.toggle('show',filled>=it.offsetTop+40))};
addEventListener('scroll',upd,{passive:true});addEventListener('resize',upd);
new MutationObserver(upd).observe(tl,{childList:true});upd();
})();
(function(){
const b=document.getElementById('copytel'),c=document.getElementById('callcard');if(!b)return;
const label=b.textContent;
const done=()=>{b.textContent=(typeof lang!=='undefined'&&lang==='ar')?'تم النسخ':'Copied';setTimeout(()=>b.textContent=label,1800)};
const fb=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('teltxt'));const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');done()}catch(_){}};
b.addEventListener('click',()=>{try{navigator.clipboard.writeText('01096070950').then(done,fb)}catch(_){fb()}});
})();
